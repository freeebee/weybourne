<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Assistant mascot — Presenting">
<title>mascot-presenting</title>

<defs>
      <g id="faceG">
        <ellipse cx="24" cy="60" rx="5" ry="7.5" fill="#EBBB94"></ellipse>
        <ellipse cx="76" cy="60" rx="5" ry="7.5" fill="#EBBB94"></ellipse>
        <path d="M26 40 C26 31 34 25 50 25 C66 25 74 31 74 40 V57 C74 76 64 88 50 88 C36 88 26 76 26 57 Z" fill="#F3CBA8"></path>
        <path d="M50 11 C32 11 23 24 24 40 C24.3 44 26 44 26.6 41 C27.8 37 30 35 34.5 33.4 C44 36 62 35.5 70 39.5 C73.4 41.2 74.8 43 75.4 45 C76.2 47.6 78 47 78 42 C78 23 68 11 50 11 Z" fill="#1C2430"></path>
        <path d="M28 44 C29 31 37 25 50 25 C59 25 65 27.5 69 32 C60 29.5 45 30.5 37 36 C33 38.6 30 41 28 44 Z" fill="#232C3A"></path>
      </g>
      <g id="glassesG">
        <g fill="#FFFFFF" opacity=".45"><rect x="28.5" y="50.5" width="18" height="14" rx="4.5"></rect><rect x="53.5" y="50.5" width="18" height="14" rx="4.5"></rect></g>
        <g fill="none" stroke="#23272E" stroke-width="2.6" stroke-linecap="round">
          <rect x="28.5" y="50.5" width="18" height="14" rx="4.5"></rect>
          <rect x="53.5" y="50.5" width="18" height="14" rx="4.5"></rect>
          <path d="M46.5 55.5 h7"></path>
          <path d="M28.5 54 l-5.5 3"></path>
          <path d="M71.5 54 l5.5 3"></path>
        </g>
      </g>
      <g id="browNormal" stroke="#1C2430" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path d="M31 46 q6 -3 12 -1"></path><path d="M69 46 q-6 -3 -12 -1"></path>
      </g>
      <g id="browFocus" stroke="#1C2430" stroke-width="2.8" stroke-linecap="round" fill="none">
        <path d="M31 44 q6 1 12 3"></path><path d="M69 44 q-6 1 -12 3"></path>
      </g>
      <g id="eyesDot" fill="#1C2430">
        <circle cx="37.5" cy="58" r="2.9"></circle><circle cx="62.5" cy="58" r="2.9"></circle>
      </g>
      <g id="eyesHappy" stroke="#1C2430" stroke-width="2.8" stroke-linecap="round" fill="none">
        <path d="M33 59.5 q4.5 -5.5 9 0"></path><path d="M58 59.5 q4.5 -5.5 9 0"></path>
      </g>
      <g id="eyesClosed" stroke="#1C2430" stroke-width="2.8" stroke-linecap="round" fill="none">
        <path d="M33 57 q4.5 5 9 0"></path><path d="M58 57 q4.5 5 9 0"></path>
      </g>
      <path id="mouthSmile" d="M43 75 q7 6 14 0" stroke="#A2664B" stroke-width="2.6" fill="none" stroke-linecap="round"></path>
      <path id="mouthFlat" d="M44 77 h12" stroke="#A2664B" stroke-width="2.6" fill="none" stroke-linecap="round"></path>
      <path id="mouthGrit" d="M42 73 h16 a4 4 0 0 1 -4 7 h-8 a4 4 0 0 1 -4 -7 Z" fill="#8C4038"></path>
      <ellipse id="mouthOpen" cx="50" cy="77" rx="5" ry="6" fill="#8C4038"></ellipse>
      <path id="mouthBigSmile" d="M40 72 q10 13 20 0 Z" fill="#8C4038"></path>

      <symbol id="headNeutral" viewBox="0 0 100 100">
        <use href="#faceG"></use><use href="#browNormal"></use><use href="#glassesG"></use><use href="#eyesDot"></use><use href="#mouthSmile"></use>
      </symbol>
      <symbol id="headFocus" viewBox="0 0 100 100">
        <use href="#faceG"></use><use href="#browFocus"></use><use href="#glassesG"></use><use href="#eyesDot"></use><use href="#mouthFlat"></use>
      </symbol>
      <symbol id="headStress" viewBox="0 0 100 100">
        <use href="#faceG"></use><use href="#browFocus"></use><use href="#glassesG"></use><use href="#eyesDot"></use><use href="#mouthGrit"></use>
      </symbol>
      <symbol id="headHappy" viewBox="0 0 100 100">
        <use href="#faceG"></use><use href="#browNormal"></use><use href="#glassesG"></use><use href="#eyesHappy"></use><use href="#mouthBigSmile"></use>
      </symbol>
      <symbol id="headSleep" viewBox="0 0 100 100">
        <use href="#faceG"></use><use href="#browNormal"></use><use href="#glassesG"></use><use href="#eyesClosed"></use><use href="#mouthOpen"></use>
      </symbol>
      <symbol id="headCalm" viewBox="0 0 100 100">
        <use href="#faceG"></use><use href="#browNormal"></use><use href="#glassesG"></use><use href="#eyesClosed"></use><use href="#mouthSmile"></use>
      </symbol>

      <g id="torsoG">
        <path d="M110 104 h20 v18 h-20 Z" fill="#E0AC85"></path>
        <path d="M120 116 C103 116 84 127 79 147 C74 167 75 188 77 202 H163 C165 188 166 167 161 147 C156 127 137 116 120 116 Z" fill="#4E7A9B"></path>
        <path d="M103 123 L120 143 L137 123 C131 118 126 116 120 116 C114 116 109 118 103 123 Z" fill="#1B2A38"></path>
