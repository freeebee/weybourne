          <path d="M80 152 H160"></path><path d="M78 172 H162"></path><path d="M77 192 H163"></path>
        </g>
      </g>

      <g id="deskG">
        <rect x="0" y="198" width="240" height="7" rx="2" fill="#C9B392"></rect>
        <rect x="0" y="205" width="240" height="6" fill="#B39C79"></rect>
      </g>

      <g id="laptopG">
        <rect x="88" y="148" width="64" height="40" rx="4" fill="#22394A"></rect>
        <rect x="93" y="153" width="54" height="30" rx="2" fill="#31536A"></rect>
        <circle cx="120" cy="168" r="6" fill="#249692" opacity=".85"></circle>
        <path d="M74 188 h92 l10 12 h-112 Z" fill="#9FB2BD"></path>
        <path d="M74 188 h92 l2 3 h-96 Z" fill="#8298A6"></path>
      </g>
