<g transform="translate(-26 0)">
            <use href="#torsoG"></use>
            <g style="animation:m-bob 3s ease-in-out infinite"><use href="#headHappy" x="70" y="24" width="100" height="100"></use></g>
            <path d="M94 140 C70 150 64 174 74 188" stroke="#41688A" stroke-width="15" stroke-linecap="round" fill="none"></path>
            <circle cx="75" cy="190" r="8.5" fill="#31567A"></circle><circle cx="75" cy="192" r="7.5" fill="#F3CBA8"></circle>
            <g style="transform-box:fill-box;transform-origin:0 100%;animation:m-point 2.6s ease-in-out infinite">
              <path d="M152 148 C170 142 182 128 190 116" stroke="#41688A" stroke-width="15" stroke-linecap="round" fill="none"></path>
              <circle cx="193" cy="112" r="7.5" fill="#F3CBA8"></circle>
            </g>
          </g>
          <g>
            <rect x="152" y="64" width="76" height="66" rx="4" fill="#FFFDF7" stroke="#D9CFBB" stroke-width="1.6"></rect>
            <g style="transform-box:fill-box;transform-origin:50% 100%;animation:m-bar 1.8s ease-in-out infinite"><rect x="164" y="96" width="12" height="22" rx="1.5" fill="#249692"></rect></g>
            <g style="transform-box:fill-box;transform-origin:50% 100%;animation:m-bar 1.8s ease-in-out .25s infinite"><rect x="184" y="84" width="12" height="34" rx="1.5" fill="#249692"></rect></g>
            <g style="transform-box:fill-box;transform-origin:50% 100%;animation:m-bar 1.8s ease-in-out .5s infinite"><rect x="204" y="74" width="12" height="44" rx="1.5" fill="#B0894E"></rect></g>
            <path d="M160 118 h60" stroke="#C9BCA4" stroke-width="2"></path>
          </g>
</svg>