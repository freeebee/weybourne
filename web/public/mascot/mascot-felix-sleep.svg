<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Felix — asleep">
<title>mascot-felix-sleep</title>
<defs>
  <g id="faceG">
    <ellipse cx="24" cy="60" rx="5" ry="7.5" fill="#EBBB94"></ellipse>
    <ellipse cx="76" cy="60" rx="5" ry="7.5" fill="#EBBB94"></ellipse>
    <path d="M26 40 C26 31 34 25 50 25 C66 25 74 31 74 40 V57 C74 76 64 88 50 88 C36 88 26 76 26 57 Z" fill="#F3CBA8"></path>
    <path d="M50 11 C32 11 23 24 24 40 C24.3 44 26 44 26.6 41 C27.8 37 30 35 34.5 33.4 C44 36 62 35.5 70 39.5 C73.4 41.2 74.8 43 75.4 45 C76.2 47.6 78 47 78 42 C78 23 68 11 50 11 Z" fill="#5C3A21"></path>
    <path d="M28 44 C29 31 37 25 50 25 C59 25 65 27.5 69 32 C60 29.5 45 30.5 37 36 C33 38.6 30 41 28 44 Z" fill="#6B4526"></path>
    <path d="M36 13 l4 -7 l3 7 Z M46 10 l4 -8 l4 8 Z M57 12 l4 -7 l3 8 Z" fill="#5C3A21"></path>
  </g>
  <g id="glassesG">
    <g fill="#FFFFFF" opacity=".45"><rect x="28.5" y="50.5" width="18" height="14" rx="4.5"></rect><rect x="53.5" y="50.5" width="18" height="14" rx="4.5"></rect></g>
    <g fill="none" stroke="#23272E" stroke-width="2.6" stroke-linecap="round">
      <rect x="28.5" y="50.5" width="18" height="14" rx="4.5"></rect>
      <rect x="53.5" y="50.5" width="18" height="14" rx="4.5"></rect>
      <path d="M46.5 55.5 h7"></path>
      <path d="M28.5 54 l-5.5 3"></path>
      <path d="M71.5 54 l5.5 3"></path>
    </g>
  </g>
  <g id="browNormal" stroke="#1C2430" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M31 46 q6 -3 12 -1"></path><path d="M69 46 q-6 -3 -12 -1"></path>
  </g>
  <g id="eyesClosed" stroke="#1C2430" stroke-width="2.8" stroke-linecap="round" fill="none">
    <path d="M33 57 q4.5 5 9 0"></path><path d="M58 57 q4.5 5 9 0"></path>
  </g>
  <ellipse id="mouthOpen" cx="50" cy="77" rx="5" ry="6" fill="#8C4038"></ellipse>
  <symbol id="headZzz" viewBox="0 0 100 100">
    <use href="#faceG"></use><use href="#browNormal"></use><use href="#glassesG"></use><use href="#eyesClosed"></use><use href="#mouthOpen"></use>
  </symbol>

  <g id="toolboxG">
    <rect x="146" y="158" width="66" height="34" rx="4" fill="#B0894E"></rect>
    <rect x="146" y="158" width="66" height="9" rx="4" fill="#8A6642"></rect>
    <rect x="168" y="150" width="22" height="12" rx="4" fill="none" stroke="#8A6642" stroke-width="5"></rect>
    <rect x="152" y="172" width="14" height="6" rx="2" fill="#F7F3EA" opacity=".5"></rect>
  </g>
</defs>

<use href="#toolboxG"></use>

<g style="animation:m-breathe 4.2s ease-in-out infinite;transform-origin:120px 170px">
  <!-- slumped body, leaning on the toolbox -->
  <g transform="rotate(6 120 170)">
    <path d="M110 96 h20 v14 h-20 Z" fill="#E0AC85"></path>
    <path d="M120 108 C103 108 90 118 86 134 C82 150 84 164 86 172 H154 C156 164 158 150 154 134 C150 118 137 108 120 108 Z" fill="#7FA6C0"></path>
    <path d="M98 133 h44 v39 h-44 Z" fill="#2F6688"></path>
    <path d="M98 114 l8 20 h-8 Z" fill="#41688A"></path>
    <path d="M142 114 l-8 20 h8 Z" fill="#41688A"></path>
    <circle cx="104" cy="138" r="2.6" fill="#B0894E"></circle>
    <circle cx="136" cy="138" r="2.6" fill="#B0894E"></circle>
    <rect x="93" y="164" width="54" height="9" rx="3" fill="#8A6642"></rect>
    <!-- legs stretched out -->
    <path d="M96 172 l-34 14 v12 l38 -12 Z" fill="#2F6688"></path>
    <path d="M60 184 l-16 6 a3.5 3.5 0 0 0 2 8 l16 -4 Z" fill="#6B4A2F"></path>
    <path d="M118 176 l-24 18 v10 l30 -16 Z" fill="#2F6688"></path>
    <path d="M92 192 l-14 10 a3.5 3.5 0 0 0 4 7 l13 -8 Z" fill="#6B4A2F"></path>
    <!-- arms folded in the lap, wrench resting -->
    <path d="M96 128 C88 140 88 154 96 164" stroke="#7FA6C0" stroke-width="13" fill="none" stroke-linecap="round"></path>
    <circle cx="97" cy="165" r="7.2" fill="#E5B84C" stroke="#C99B33" stroke-width="1.8"></circle>
    <path d="M144 128 C152 140 152 154 144 164" stroke="#7FA6C0" stroke-width="13" fill="none" stroke-linecap="round"></path>
    <circle cx="143" cy="165" r="7.2" fill="#E5B84C" stroke="#C99B33" stroke-width="1.8"></circle>
  </g>
  <use href="#headZzz" x="74" y="10" width="100" height="100" transform="rotate(8 124 60)"></use>
</g>

<!-- drifting Z's -->
<g fill="#2F6688" font-family="Georgia, serif" font-weight="bold">
  <text x="168" y="70" font-size="20" style="animation:m-z 3.2s ease-in-out infinite">z</text>
  <text x="182" y="56" font-size="26" style="animation:m-z 3.2s ease-in-out infinite;animation-delay:1.1s">z</text>
  <text x="198" y="42" font-size="32" style="animation:m-z 3.2s ease-in-out infinite;animation-delay:2.2s">z</text>
</g>
</svg>
