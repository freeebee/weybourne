<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Felix — inspecting">
<title>mascot-felix-inspect</title>
<defs>
  <g id="faceG">
    <ellipse cx="24" cy="60" rx="5" ry="7.5" fill="#EBBB94"></ellipse>
    <ellipse cx="76" cy="60" rx="5" ry="7.5" fill="#EBBB94"></ellipse>
    <path d="M26 40 C26 31 34 25 50 25 C66 25 74 31 74 40 V57 C74 76 64 88 50 88 C36 88 26 76 26 57 Z" fill="#F3CBA8"></path>
    <path d="M50 11 C32 11 23 24 24 40 C24.3 44 26 44 26.6 41 C27.8 37 30 35 34.5 33.4 C44 36 62 35.5 70 39.5 C73.4 41.2 74.8 43 75.4 45 C76.2 47.6 78 47 78 42 C78 23 68 11 50 11 Z" fill="#5C3A21"></path>
    <path d="M28 44 C29 31 37 25 50 25 C59 25 65 27.5 69 32 C60 29.5 45 30.5 37 36 C33 38.6 30 41 28 44 Z" fill="#6B4526"></path>
    <path d="M36 13 l4 -7 l3 7 Z M46 10 l4 -8 l4 8 Z M57 12 l4 -7 l3 8 Z" fill="#5C3A21"></path>
  </g>
  <g id="glassesG">
    <g fill="#FFFFFF" opacity=".45"><rect x="28.5" y="50.5" width="18" height="14" rx="4.5"></rect><rect x="53.5" y="50.5" width="18" height="14" rx="4.5"></rect></g>
    <g fill="none" stroke="#23272E" stroke-width="2.6" stroke-linecap="round">
      <rect x="28.5" y="50.5" width="18" height="14" rx="4.5"></rect>
      <rect x="53.5" y="50.5" width="18" height="14" rx="4.5"></rect>
      <path d="M46.5 55.5 h7"></path>
      <path d="M28.5 54 l-5.5 3"></path>
      <path d="M71.5 54 l5.5 3"></path>
    </g>
  </g>
  <g id="browFocus" stroke="#1C2430" stroke-width="2.8" stroke-linecap="round" fill="none">
    <path d="M31 44 q6 1 12 3"></path><path d="M69 44 q-6 1 -12 3"></path>
  </g>
  <g id="eyesDot" fill="#1C2430">
    <circle cx="37.5" cy="58" r="2.9"></circle><circle cx="62.5" cy="58" r="2.9"></circle>
  </g>
  <path id="mouthFlat" d="M44 77 h12" stroke="#A2664B" stroke-width="2.6" fill="none" stroke-linecap="round"></path>
  <symbol id="headInspect" viewBox="0 0 100 100">
    <use href="#faceG"></use><use href="#browFocus"></use><use href="#glassesG"></use><use href="#eyesDot"></use><use href="#mouthFlat"></use>
  </symbol>

  <g id="felixBody">
    <path d="M110 92 h20 v16 h-20 Z" fill="#E0AC85"></path>
    <path d="M120 106 C103 106 91 114 87 129 C83 143 84 158 85 166 H155 C156 158 157 143 153 129 C149 114 137 106 120 106 Z" fill="#7FA6C0"></path>
    <path d="M98 131 h44 v35 h-44 Z" fill="#2F6688"></path>
    <path d="M98 112 l8 20 h-8 Z" fill="#41688A"></path>
    <path d="M142 112 l-8 20 h8 Z" fill="#41688A"></path>
    <circle cx="104" cy="136" r="2.6" fill="#B0894E"></circle>
    <circle cx="136" cy="136" r="2.6" fill="#B0894E"></circle>
    <rect x="112" y="142" width="16" height="13" rx="2.5" fill="#41688A"></rect>
    <rect x="93" y="159" width="54" height="9" rx="3" fill="#8A6642"></rect>
    <rect x="115" y="160" width="10" height="7" rx="1.5" fill="#B0894E"></rect>
    <rect x="97" y="164" width="13" height="15" rx="2.5" fill="#7A5A3C"></rect>
    <rect x="101.5" y="155" width="3.4" height="11" rx="1.6" fill="#9FB2BD"></rect>
    <path d="M101 166 h15 v26 h-15 Z" fill="#2F6688"></path>
    <path d="M124 166 h15 v26 h-15 Z" fill="#2F6688"></path>
    <path d="M99 192 h19 a3.5 3.5 0 0 1 3 7 h-22 Z" fill="#6B4A2F"></path>
    <path d="M122 192 h19 a3.5 3.5 0 0 1 3 7 h-22 Z" fill="#6B4A2F"></path>
  </g>
</defs>

<g style="animation:m-bob 2.4s ease-in-out infinite">
  <use href="#felixBody"></use>
  <use href="#headInspect" x="70" y="4" width="100" height="100"></use>

  <!-- left arm holds the clipboard -->
  <path d="M94 122 C84 130 82 142 88 152" stroke="#7FA6C0" stroke-width="13" fill="none" stroke-linecap="round"></path>
  <circle cx="89" cy="153" r="7.2" fill="#E5B84C" stroke="#C99B33" stroke-width="1.8"></circle>
  <g transform="translate(66 130) rotate(-8)">
    <rect x="0" y="0" width="30" height="38" rx="3" fill="#C9B392"></rect>
    <rect x="3" y="4" width="24" height="31" rx="2" fill="#F7F3EA"></rect>
    <rect x="10" y="-3" width="10" height="7" rx="2" fill="#8A6642"></rect>
    <g stroke="#8298A6" stroke-width="2" stroke-linecap="round">
      <path d="M7 12 h16"></path><path d="M7 19 h16"></path><path d="M7 26 h10"></path>
    </g>
  </g>

  <!-- right arm raises the magnifier, slow scan -->
  <g style="animation:m-tilt 2.4s ease-in-out infinite;transform-origin:146px 122px">
    <path d="M146 122 C158 118 166 108 170 98" stroke="#7FA6C0" stroke-width="13" fill="none" stroke-linecap="round"></path>
    <circle cx="170" cy="97" r="7.2" fill="#E5B84C" stroke="#C99B33" stroke-width="1.8"></circle>
    <g transform="translate(176 78)">
      <circle cx="0" cy="0" r="13" fill="#FFFFFF" opacity=".35"></circle>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#8A6642" stroke-width="3.4"></circle>
      <path d="M9 10 l10 11" stroke="#8A6642" stroke-width="4.6" stroke-linecap="round"></path>
    </g>
  </g>
</g>
</svg>
