<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="240" height="240" role="img" aria-label="Felix — tinkering" shape-rendering="crispEdges">
<title>mascot-felix-fix</title>
<!-- 8-bit Felix: two frames swapped by the px-swap keyframes (steps feel). -->
<defs>
  <g id="felixCore">
    <!-- hair spikes + mop -->
    <rect x="3" y="0" width="1" height="1" fill="#5C3A21"/>
    <rect x="6" y="0" width="1" height="1" fill="#5C3A21"/>
    <rect x="9" y="0" width="1" height="1" fill="#5C3A21"/>
    <rect x="2" y="1" width="9" height="1" fill="#5C3A21"/>
    <rect x="2" y="2" width="10" height="1" fill="#6B4526"/>
    <!-- face -->
    <rect x="3" y="3" width="8" height="1" fill="#F3CBA8"/>
    <!-- glasses band + arms -->
    <rect x="2" y="4" width="1" height="1" fill="#1C2430"/>
    <rect x="3" y="4" width="3" height="1" fill="#1C2430"/>
    <rect x="6" y="4" width="2" height="1" fill="#3A4454"/>
    <rect x="8" y="4" width="3" height="1" fill="#1C2430"/>
    <rect x="11" y="4" width="1" height="1" fill="#1C2430"/>
    <!-- eyes -->
    <rect x="3" y="5" width="8" height="1" fill="#F3CBA8"/>
    <rect x="4" y="5" width="1" height="1" fill="#FFFFFF"/>
    <rect x="9" y="5" width="1" height="1" fill="#FFFFFF"/>
    <!-- mouth -->
    <rect x="3" y="6" width="8" height="1" fill="#F3CBA8"/>
    <rect x="6" y="6" width="2" height="1" fill="#8C4038"/>
    <!-- neck -->
    <rect x="5" y="7" width="4" height="1" fill="#F3CBA8"/>
    <!-- shoulders / shirt -->
    <rect x="3" y="8" width="8" height="1" fill="#7FA6C0"/>
    <rect x="4" y="8" width="1" height="1" fill="#41688A"/>
    <rect x="9" y="8" width="1" height="1" fill="#41688A"/>
    <!-- overalls bib + shirt sides -->
    <rect x="3" y="9" width="1" height="2" fill="#7FA6C0"/>
    <rect x="10" y="9" width="1" height="2" fill="#7FA6C0"/>
    <rect x="4" y="9" width="6" height="4" fill="#2F6688"/>
    <rect x="6" y="10" width="2" height="1" fill="#41688A"/>
    <!-- left arm on hip -->
    <rect x="2" y="9" width="1" height="3" fill="#7FA6C0"/>
    <rect x="2" y="12" width="1" height="1" fill="#E5B84C"/>
    <!-- toolbelt -->
    <rect x="3" y="13" width="8" height="1" fill="#8A6642"/>
    <rect x="7" y="13" width="1" height="1" fill="#E5B84C"/>
    <!-- legs -->
    <rect x="4" y="14" width="2" height="3" fill="#2F6688"/>
    <rect x="8" y="14" width="2" height="3" fill="#2F6688"/>
    <!-- boots -->
    <rect x="3" y="17" width="3" height="1" fill="#6B4A2F"/>
    <rect x="8" y="17" width="3" height="1" fill="#6B4A2F"/>
  </g>
</defs>

<!-- frame A: wrench raised -->
<g style="animation:px-swapA .42s steps(1) infinite">
  <use href="#felixCore"/>
  <rect x="11" y="8" width="1" height="1" fill="#7FA6C0"/>
  <rect x="12" y="7" width="1" height="1" fill="#7FA6C0"/>
  <rect x="12" y="6" width="1" height="1" fill="#E5B84C"/>
  <rect x="13" y="3" width="1" height="3" fill="#9FB2BD"/>
  <rect x="12" y="2" width="1" height="1" fill="#9FB2BD"/>
  <rect x="14" y="2" width="1" height="1" fill="#9FB2BD"/>
  <rect x="12" y="1" width="1" height="1" fill="#9FB2BD"/>
  <rect x="14" y="1" width="1" height="1" fill="#9FB2BD"/>
</g>

<!-- frame B: wrench slammed down, spark -->
<g style="animation:px-swapB .42s steps(1) infinite">
  <use href="#felixCore"/>
  <rect x="11" y="9" width="1" height="1" fill="#7FA6C0"/>
  <rect x="12" y="10" width="1" height="1" fill="#7FA6C0"/>
  <rect x="13" y="10" width="1" height="1" fill="#E5B84C"/>
  <rect x="14" y="10" width="3" height="1" fill="#9FB2BD"/>
  <rect x="17" y="9" width="1" height="1" fill="#9FB2BD"/>
  <rect x="17" y="11" width="1" height="1" fill="#9FB2BD"/>
  <rect x="18" y="8" width="1" height="1" fill="#E5B84C"/>
  <rect x="19" y="10" width="1" height="1" fill="#E5B84C"/>
</g>
</svg>
