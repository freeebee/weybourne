<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Felix — walking">
<title>mascot-felix-walk</title>
<defs>
  <g id="faceG">
    <ellipse cx="24" cy="60" rx="5" ry="7.5" fill="#EBBB94"></ellipse>
    <ellipse cx="76" cy="60" rx="5" ry="7.5" fill="#EBBB94"></ellipse>
    <path d="M26 40 C26 31 34 25 50 25 C66 25 74 31 74 40 V57 C74 76 64 88 50 88 C36 88 26 76 26 57 Z" fill="#F3CBA8"></path>
    <path d="M50 11 C32 11 23 24 24 40 C24.3 44 26 44 26.6 41 C27.8 37 30 35 34.5 33.4 C44 36 62 35.5 70 39.5 C73.4 41.2 74.8 43 75.4 45 C76.2 47.6 78 47 78 42 C78 23 68 11 50 11 Z" fill="#5C3A21"></path>
    <path d="M28 44 C29 31 37 25 50 25 C59 25 65 27.5 69 32 C60 29.5 45 30.5 37 36 C33 38.6 30 41 28 44 Z" fill="#6B4526"></path>
    <path d="M36 13 l4 -7 l3 7 Z M46 10 l4 -8 l4 8 Z M57 12 l4 -7 l3 8 Z" fill="#5C3A21"></path>
  </g>
  <g id="glassesG">
    <g fill="#FFFFFF" opacity=".45"><rect x="28.5" y="50.5" width="18" height="14" rx="4.5"></rect><rect x="53.5" y="50.5" width="18" height="14" rx="4.5"></rect></g>
    <g fill="none" stroke="#23272E" stroke-width="2.6" stroke-linecap="round">
      <rect x="28.5" y="50.5" width="18" height="14" rx="4.5"></rect>
      <rect x="53.5" y="50.5" width="18" height="14" rx="4.5"></rect>
      <path d="M46.5 55.5 h7"></path>
      <path d="M28.5 54 l-5.5 3"></path>
      <path d="M71.5 54 l5.5 3"></path>
    </g>
  </g>
  <g id="browNormal" stroke="#1C2430" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M31 46 q6 -3 12 -1"></path><path d="M69 46 q-6 -3 -12 -1"></path>
  </g>
  <g id="eyesDot" fill="#1C2430">
    <circle cx="37.5" cy="58" r="2.9"></circle><circle cx="62.5" cy="58" r="2.9"></circle>
  </g>
  <path id="mouthSmile" d="M43 75 q7 6 14 0" stroke="#A2664B" stroke-width="2.6" fill="none" stroke-linecap="round"></path>
  <symbol id="headWalk" viewBox="0 0 100 100">
    <use href="#faceG"></use><use href="#browNormal"></use><use href="#glassesG"></use><use href="#eyesDot"></use><use href="#mouthSmile"></use>
  </symbol>

  <g id="felixTorso">
    <path d="M110 92 h20 v16 h-20 Z" fill="#E0AC85"></path>
    <path d="M120 106 C103 106 91 114 87 129 C83 143 84 158 85 166 H155 C156 158 157 143 153 129 C149 114 137 106 120 106 Z" fill="#7FA6C0"></path>
    <path d="M98 131 h44 v35 h-44 Z" fill="#2F6688"></path>
    <path d="M98 112 l8 20 h-8 Z" fill="#41688A"></path>
    <path d="M142 112 l-8 20 h8 Z" fill="#41688A"></path>
    <circle cx="104" cy="136" r="2.6" fill="#B0894E"></circle>
    <circle cx="136" cy="136" r="2.6" fill="#B0894E"></circle>
    <rect x="112" y="142" width="16" height="13" rx="2.5" fill="#41688A"></rect>
    <rect x="93" y="159" width="54" height="9" rx="3" fill="#8A6642"></rect>
    <rect x="115" y="160" width="10" height="7" rx="1.5" fill="#B0894E"></rect>
  </g>
  <g id="legL">
    <path d="M104 166 h15 v26 h-15 Z" fill="#2F6688"></path>
    <path d="M102 192 h19 a3.5 3.5 0 0 1 3 7 h-22 Z" fill="#6B4A2F"></path>
  </g>
  <g id="legR">
    <path d="M121 166 h15 v26 h-15 Z" fill="#2F6688"></path>
    <path d="M119 192 h19 a3.5 3.5 0 0 1 3 7 h-22 Z" fill="#6B4A2F"></path>
  </g>
  <g id="wrenchG">
    <rect x="-3.6" y="-2" width="7.2" height="34" rx="3.4" fill="#9FB2BD"></rect>
    <path d="M-10 -6 a11.5 11.5 0 0 1 20 0 l-4.5 6 a6.5 6.5 0 0 0 -11 0 Z" fill="#9FB2BD"></path>
  </g>
</defs>

<!-- legs stride from the hip -->
<g style="animation:m-walkA .55s ease-in-out infinite;transform-origin:112px 168px"><use href="#legL"></use></g>
<g style="animation:m-walkB .55s ease-in-out infinite;transform-origin:128px 168px"><use href="#legR"></use></g>

<g style="animation:m-bob .55s ease-in-out infinite">
  <use href="#felixTorso"></use>
  <use href="#headWalk" x="70" y="4" width="100" height="100"></use>

  <!-- left arm swings -->
  <g style="animation:m-walkB .55s ease-in-out infinite;transform-origin:94px 122px">
    <path d="M94 122 C86 134 85 146 90 156" stroke="#7FA6C0" stroke-width="13" fill="none" stroke-linecap="round"></path>
    <circle cx="90" cy="157" r="7.2" fill="#E5B84C" stroke="#C99B33" stroke-width="1.8"></circle>
  </g>
  <!-- right arm carries the wrench -->
  <g style="animation:m-walkA .55s ease-in-out infinite;transform-origin:146px 122px">
    <path d="M146 122 C154 134 155 146 150 156" stroke="#7FA6C0" stroke-width="13" fill="none" stroke-linecap="round"></path>
    <circle cx="150" cy="157" r="7.2" fill="#E5B84C" stroke="#C99B33" stroke-width="1.8"></circle>
    <g transform="translate(152 162) rotate(160)"><use href="#wrenchG"></use></g>
  </g>
</g>
</svg>
